name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install -e .
      - name: Validate source
        run: |
          ruff check .
          python -m compileall -q cli.py gui.py server.py web_gui.py video_mcp tests
          python -m json.tool examples/mock-product/video-project.json > /dev/null
          python -m json.tool examples/product-video/video-project.json > /dev/null
      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    name: Build release artifacts
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: validate-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build packages
        run: |
          python -m pip install --upgrade pip build Markdown
          python -m build
          RELEASE_VERSION="${GITHUB_REF_NAME}" python scripts/package_release.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: launchframe-${{ github.ref_name }}
          path: |
            dist/
            release/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: launchframe-${{ github.ref_name }}
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/dist/* artifacts/release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
